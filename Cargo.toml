[package]
name = "dflow"
version = "0.1.0"
edition = "2024"
description = "Git snapshot and code impact analysis CLI"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
git2 = "0.20"
petgraph = "0.8"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tree-sitter = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24.2"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
