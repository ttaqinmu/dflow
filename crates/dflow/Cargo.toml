[package]
name = "dflow"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
default = []
tui = ["dep:dflow-tui"]
gui = ["dep:dflow-gui"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
dflow-core = { path = "../dflow-core" }
dflow-tui = { path = "../dflow-tui", optional = true }
dflow-gui = { path = "../dflow-gui", optional = true }
serde_json = "1"

[dev-dependencies]
git2 = "0.20"
tempfile = "3"
